<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Studio — GTA-style cover art maker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="app-bar">
  <div class="brand">VICE COVER STUDIO</div>
  <p class="brand-sub">Turn photos into multi-panel cover-art posters. Offline, nothing uploads.</p>
</header>
<main id="layout">
  <section id="stage-wrap">
    <div id="stage">
      <div id="poster"></div>
    </div>
    <p id="stage-hint">Click a panel to select it, then pick a photo for it below.</p>
  </section>
  <aside id="controls">
    <label class="field">
      <span>Title</span>
      <input id="title-input" type="text" value="VICE CITY HEAT" maxlength="30">
    </label>
    <label class="field">
      <span>Tagline</span>
      <input id="tagline-input" type="text" value="ONE LAST SCORE AT SUNSET" maxlength="48">
    </label>
    <div class="field-row">
      <label class="field">
        <span>Layout</span>
        <select id="layout-select"></select>
      </label>
      <label class="field">
        <span>Poster size</span>
        <select id="size-select"></select>
      </label>
      <label class="field">
        <span>Grade</span>
        <select id="grade-select"></select>
      </label>
    </div>
    <div class="field">
      <span id="slot-label">Panel 1</span>
      <div id="thumbs"></div>
    </div>
    <label class="field">
      <span>Use your own photo for this panel</span>
      <input id="upload-input" type="file" accept="image/*">
    </label>
    <div class="field-row sliders">
      <label class="field">
        <span>Zoom</span>
        <input id="zoom-input" type="range" min="1" max="2.4" step="0.02" value="1">
      </label>
      <label class="field">
        <span>Shift X</span>
        <input id="ox-input" type="range" min="-30" max="30" step="1" value="0">
      </label>
      <label class="field">
        <span>Shift Y</span>
        <input id="oy-input" type="range" min="-30" max="30" step="1" value="0">
      </label>
    </div>
    <div class="actions">
      <button id="randomize-btn" type="button">Randomize</button>
      <button id="export-btn" type="button">Export PNG</button>
    </div>
  </aside>
</main>
<script type="module" src="src/main.js"></script>
</body>
</html>
